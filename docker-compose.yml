# ─────────────────────────────────────────────────────────────────────────────
# University Data Platform — Week 1 infrastructure
# Services: postgres, redis, airflow-init, airflow-webserver, airflow-scheduler,
#           airflow-worker, minio
# Volumes : postgres-data, redis-data, minio-data
# ─────────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: university-data-platform/airflow:2.10.4-playwright
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-university-data-platform-secret}
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Les dépendances Python (requests, minio, beautifulsoup4, playwright, …)
    # sont préinstallées dans l'image custom — voir airflow/Dockerfile.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # Variables d'ingestion exposées aux DAGs
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    MINIO_SECURE: ${MINIO_SECURE}
    CRAWLER_ROOT_URL: ${CRAWLER_ROOT_URL}
    CRAWLER_SOURCE_NAME: ${CRAWLER_SOURCE_NAME}
    CRAWLER_MAX_DEPTH: ${CRAWLER_MAX_DEPTH}
    CRAWLER_MAX_PAGES: ${CRAWLER_MAX_PAGES}
    CRAWLER_REQUEST_TIMEOUT: ${CRAWLER_REQUEST_TIMEOUT}
    CRAWLER_ENABLE_PLAYWRIGHT: ${CRAWLER_ENABLE_PLAYWRIGHT:-true}
    PYTHONPATH: /opt/airflow/project:/opt/airflow/project/spark


  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./spark:/opt/airflow/project/spark
    # On monte le code Python du projet pour que les DAGs puissent importer
    # ingestion/, storage/, utils/, configs/ comme modules.
    - ./ingestion:/opt/airflow/project/ingestion
    - ./storage:/opt/airflow/project/storage
    - ./utils:/opt/airflow/project/utils
    - ./configs:/opt/airflow/project/configs
    - ./search:/opt/airflow/project/search
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy


services:

  postgres:
    image: postgres:15
    container_name: university-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s

    networks:
      - university-network      
    restart: always

  hive-metastore-db-init:
    image: postgres:15
    container_name: hive-metastore-db-init
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        until pg_isready -h postgres -U ${POSTGRES_USER}; do
          sleep 2
        done
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc "SELECT 1 FROM pg_roles WHERE rolname='hive'" | grep -q 1 || psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c "CREATE USER hive WITH PASSWORD 'hive';"
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc "SELECT 1 FROM pg_database WHERE datname='hive_metastore'" | grep -q 1 || psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c "CREATE DATABASE hive_metastore OWNER hive;"
        psql -h postgres -U ${POSTGRES_USER} -d hive_metastore -c "ALTER SCHEMA public OWNER TO hive;"
        echo "Hive metastore database ready"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - university-network
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: university-redis
    expose:
      - 6379
    volumes:
      - redis-data:/data

    networks:
      - university-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  minio:
    image: minio/minio:latest
    container_name: university-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - university-network  
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: university-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    networks:
      - university-network
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: university-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - university-network  
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: university-airflow-scheduler
    command: scheduler
    networks:
      - university-network    
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: university-airflow-worker
    command: celery worker
    networks:
      - university-network    
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-master

    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

    environment:
      - PYTHONPATH=/opt:/opt/spark-apps:/opt/search
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      

    ports:
      - "8081:8080"
      - "7077:7077"

    volumes:
      - ./spark:/opt/spark-apps
      - ./spark/jars/hadoop-aws-3.3.4.jar:/opt/spark/jars/hadoop-aws-3.3.4.jar
      - ./spark/jars/aws-java-sdk-bundle-1.12.262.jar:/opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar
      - ./spark/jars/hudi-spark3.5-bundle_2.12-0.15.0.jar:/opt/spark/jars/hudi-spark3.5-bundle_2.12-0.15.0.jar
      - ./search:/opt/search
    networks:
      - university-network
    restart: always  

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-worker

    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    environment:
      PYTHONPATH: /opt:/opt/spark-apps:/opt/search

    depends_on:
      - spark-master
    
    volumes:
      - ./spark:/opt/spark-apps
      - ./spark/jars/hadoop-aws-3.3.4.jar:/opt/spark/jars/hadoop-aws-3.3.4.jar
      - ./spark/jars/aws-java-sdk-bundle-1.12.262.jar:/opt/spark/jars/aws-java-sdk-bundle-1.12.262.jar
      - ./spark/jars/hudi-spark3.5-bundle_2.12-0.15.0.jar:/opt/spark/jars/hudi-spark3.5-bundle_2.12-0.15.0.jar
      - ./search:/opt/search
    networks:
      - university-network
    restart: always

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /tmp/hive
        chmod -R 777 /tmp/hive
        exec /entrypoint.sh

    environment:
      SERVICE_NAME: hiveserver2
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      DB_DRIVER: postgres
      SKIP_SCHEMA_INIT: "true"
      HADOOP_CLIENT_OPTS: "-Xmx2G"
      # JARs auxiliaires pour Hudi + S3A
      HIVE_AUX_JARS_PATH: "/opt/hive/auxlib/hudi-spark3.5-bundle_2.12-0.15.0.jar:/opt/hive/auxlib/hadoop-aws-3.3.4.jar:/opt/hive/auxlib/aws-java-sdk-bundle-1.12.262.jar"

    ports:
      - "10000:10000"

    depends_on:
      hive-metastore:
        condition: service_healthy

    volumes:
      - ./spark/jars/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
      - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      # JARs Hudi + S3A pour Hive-Server
      - ./spark/jars/hudi-spark3.5-bundle_2.12-0.15.0.jar:/opt/hive/auxlib/hudi-spark3.5-bundle_2.12-0.15.0.jar
      - ./spark/jars/hadoop-aws-3.3.4.jar:/opt/hive/auxlib/hadoop-aws-3.3.4.jar
      - ./spark/jars/aws-java-sdk-bundle-1.12.262.jar:/opt/hive/auxlib/aws-java-sdk-bundle-1.12.262.jar

    healthcheck:
      # CORRIGÉ : utiliser beeline au lieu de curl
      test: ["CMD", "/opt/hive/bin/beeline", "-u", "jdbc:hive2://localhost:10000", "-e", "show databases;", "--silent=true"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

    networks:
      - university-network
    restart: always

  hive-metastore-init:
    image: apache/hive:4.0.0
    container_name: hive-metastore-init
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/hive_metastore
      HIVE_METASTORE_JDBC_USER: hive
      HIVE_METASTORE_JDBC_PASS: hive
      SKIP_SCHEMA_INIT: "true"
    entrypoint: /bin/bash
    command: >
      -c "/opt/hive/bin/schematool -dbType postgres -initOrUpgradeSchema --verbose && echo DONE"

    depends_on: 
      hive-metastore-db-init:
        condition: service_completed_successfully
    volumes:
      - ./spark/jars/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
      - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./spark/jars/hadoop-aws-3.3.4.jar:/opt/hive/auxlib/hadoop-aws-3.3.4.jar
      - ./spark/jars/aws-java-sdk-bundle-1.12.262.jar:/opt/hive/auxlib/aws-java-sdk-bundle-1.12.262.jar
    networks:
      - university-network
    restart: "no"


  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/hive_metastore
      HIVE_METASTORE_JDBC_USER: hive
      HIVE_METASTORE_JDBC_PASS: hive
      HADOOP_CLIENT_OPTS: "-Xmx2G"
      HIVE_AUX_JARS_PATH: "/opt/hive/auxlib/hadoop-aws-3.3.4.jar:/opt/hive/auxlib/aws-java-sdk-bundle-1.12.262.jar"
    depends_on:
      hive-metastore-init:
        condition: service_completed_successfully
    ports:
      - "9083:9083"
    volumes:
      - ./spark/jars/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
      - ./hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./spark/jars/hadoop-aws-3.3.4.jar:/opt/hive/auxlib/hadoop-aws-3.3.4.jar
      - ./spark/jars/aws-java-sdk-bundle-1.12.262.jar:/opt/hive/auxlib/aws-java-sdk-bundle-1.12.262.jar
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - university-network
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: university-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200 >/dev/null || exit 1"
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

    restart: always

    networks:
      - university-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0

    container_name: university-kibana

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    ports:
      - "5601:5601"

    depends_on:
      elasticsearch:
        condition: service_healthy

    restart: always

    networks:
      - university-network


volumes:
  postgres-data:
  redis-data:
  minio-data:
  elasticsearch-data:
  

networks:
  university-network:
    driver: bridge  
